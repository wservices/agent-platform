# Platform repo CI: self-test the helpers so downstream repos can trust them.
stages: [validate, test]

default:
  image: python:3.12-slim
  before_script:
    - python3 -m pip install --quiet --disable-pip-version-check pyyaml pytest 2>/dev/null || true

selftest-validator:
  stage: validate
  script:
    - python3 -m py_compile ci/validate_skills.py ci/secret_scan.py scripts/gitlab_provision.sh 2>/dev/null || python3 -m py_compile ci/validate_skills.py ci/secret_scan.py
    - python3 ci/secret_scan.py .

unit-tests:
  stage: test
  script:
    - python3 -m pytest tests -q
